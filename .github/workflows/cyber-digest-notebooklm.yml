name: Cyber Digest (NotebookLM)

on:
  # Gemini 版 (cyber-digest.yml) の完了後に実行する。
  #
  # 両者は同じ CyberDigest/{日付}.md に書き込むため、同時刻 cron のままだと
  # 「後に完了した方が勝つ」レースになり、日によって内容が変わってしまう。
  #
  # cron を30分ずらす案もあったが、GitHub Actions の cron は負荷状況で
  # 数時間ずれることがあり（予定23:00 → 実行12:06 の実観測あり）、
  # 時間差では順序を保証できない。workflow_run なら確実に「Gemini の後」になる。
  #
  # 結果として:
  #   - まず Gemini 版が必ず生成される（土台。成功率100%）
  #   - NotebookLM が成功した日だけ、引用付きの高品質版に差し替わる
  #   - NotebookLM が失敗しても Gemini 版が残るので穴が空かない
  workflow_run:
    workflows: ["Cyber Digest"]
    types: [completed]
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (with domain migration patch)
        run: |
          # Google が NotebookLM を notebooklm.google.com から notebook.google.com へ
          # 移行したが、notebooklm-py は旧ドメインを決め打ちしている（0.8.0 でも未対応）。
          # さらに auth.py の Cookie 絞り込みも旧ドメインしか許可しないため、
          # 新ドメインにホストスコープで発行される OSID / __Secure-OSID が捨てられ、
          # 「Authentication expired or invalid」で必ず失敗する。
          # 下の置換で「APIのURL」と「Cookie許可ドメイン」の両方が同時に直る。
          # 0.3.4 は動作検証済み。0.8.0 は未対応かつAPI変更があるためバージョン固定する。
          set -e
          pip install 'notebooklm-py==0.3.4'
          PKG=$(python -c "import notebooklm, pathlib; print(pathlib.Path(notebooklm.__file__).parent)")
          echo "package dir: $PKG"
          BEFORE=$(grep -rl 'notebooklm\.google\.com' "$PKG" --include=*.py | wc -l)
          if [ "$BEFORE" -eq 0 ]; then
            echo "ERROR: 置換対象が見つかりません。上流で構成が変わった可能性があります" >&2
            exit 1
          fi
          grep -rl 'notebooklm\.google\.com' "$PKG" --include=*.py \
            | xargs sed -i 's/notebooklm\.google\.com/notebook.google.com/g'
          AFTER=$(grep -r 'notebooklm\.google\.com' "$PKG" --include=*.py | wc -l)
          echo "patched files: $BEFORE / remaining refs: $AFTER"
          if [ "$AFTER" -ne 0 ]; then
            echo "ERROR: 置換しきれていません" >&2
            exit 1
          fi

      - name: Run Cyber Digest (NotebookLM)
        env:
          NOTEBOOKLM_SESSION: ${{ secrets.NOTEBOOKLM_SESSION }}
        run: |
          set +e
          python scripts/run_notebooklm_digest.py > /tmp/digest_out.md 2>/tmp/digest_err.txt
          EXIT=$?
          set -e
          echo "=== STDERR ===" >&2
          cat /tmp/digest_err.txt >&2
          echo "=== EXIT: $EXIT ===" >&2
          if [ $EXIT -eq 0 ] && head -1 /tmp/digest_out.md | grep -q '^---'; then
            TODAY=$(python -c "from datetime import datetime, timezone, timedelta; print(datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d'))")
            cp /tmp/digest_out.md CyberDigest/${TODAY}.md
            echo "Saved: CyberDigest/${TODAY}.md"
          else
            echo "Script failed or output invalid — skipping"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.email "cyber-digest-bot@github-actions"
          git config user.name "cyber-digest-bot"
          git config pull.rebase true
          TODAY=$(python -c "from datetime import datetime, timezone, timedelta; print(datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d'))")
          git add CyberDigest/
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "cyber-digest(notebooklm): ${TODAY}"
          # Retry push with rebase on conflict
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Push failed after 5 attempts"
          exit 1
