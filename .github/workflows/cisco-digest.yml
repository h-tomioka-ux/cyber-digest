name: Cisco Digest

on:
  schedule:
    # 08:30 JST Monday.
    # Cyber Digest は '0 23 * * 0-4' (= 日曜含む 23:00 UTC) で走るため、
    # 同じ 23:00 にすると同一ブランチへの push が競合する。30分ずらす。
    - cron: '30 23 * * 0'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 依存パッケージは不要。Gemini は標準ライブラリの urllib で直接叩いている
      # (scripts/run_digest.py の _call_gemini_http)。google-genai は使っていない。

      - name: Run Cisco Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # bash -e のままだと python が失敗した瞬間にステップが終了し、
          # 後続の cat でログを出せずデバッグ不能になる。明示的に囲う。
          set +e
          python scripts/run_cisco_digest.py > /tmp/cisco_out.md 2>/tmp/cisco_err.txt
          EXIT=$?
          set -e
          echo "=== STDERR ==="
          cat /tmp/cisco_err.txt
          echo "=== EXIT: $EXIT ==="
          if [ $EXIT -eq 0 ] && head -1 /tmp/cisco_out.md | grep -q '^---'; then
            TODAY=$(python -c "from datetime import datetime, timezone, timedelta; print(datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d'))")
            cp /tmp/cisco_out.md CiscoDigest/${TODAY}.md
            echo "Saved: CiscoDigest/${TODAY}.md"
          else
            echo "Script failed or output invalid — skipping"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.email "cisco-digest-bot@github-actions"
          git config user.name "cisco-digest-bot"
          git config pull.rebase true
          TODAY=$(python -c "from datetime import datetime, timezone, timedelta; print(datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d'))")
          git add CiscoDigest/
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "cisco-digest: ${TODAY}"
          # 複数ワークフローが同じ main を押すため、rejected を想定してリトライする
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then echo "Push OK on attempt $i"; exit 0; fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Push failed after 5 attempts"; exit 1
